
AWSTemplateFormatVersion: '2010-09-09'

Description: TA-2 Event-Driven Serverless File Processing

Parameters:
  BucketName:
    Type: String
    Description: Enter a globally unique lowercase S3 bucket name
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: Use a unique S3 bucket name with lowercase letters, numbers, dots or hyphens.

  NotificationEmail:
    Type: String
    Description: Email address for SNS notifications

Resources:
  FileProcessingVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: TA2-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref FileProcessingVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: TA2-Public-Subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: TA2-Private-Subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachInternetGateway
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicSubnetRouteAssociation
    Properties:
      AllocationId: !GetAtt NatElasticIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: TA2-NAT-Gateway

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow outbound traffic from Lambda
      VpcId: !Ref FileProcessingVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  FileProcessingTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileProcessingAlerts

  FileProcessingEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref FileProcessingTopic

  FileProcessingBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3InvokeLambdaPermission
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt FileProcessingLambda.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: FileProcessingPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/*'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref FileProcessingTopic

  FileProcessingLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TA2-FileProcessingFunction
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref FileProcessingTopic
      Code:
        ZipFile: |
          import json
          import os
          import urllib.parse
          import boto3
          from datetime import datetime, timezone

          s3 = boto3.client('s3')
          sns = boto3.client('sns')

          def lambda_handler(event, context):
              for record in event['Records']:
                  bucket = record['s3']['bucket']['name']
                  key = urllib.parse.unquote_plus(
                      record['s3']['object']['key']
                  )

                  response = s3.get_object(
                      Bucket=bucket,
                      Key=key
                  )

                  metadata = {
                      'source_bucket': bucket,
                      'source_key': key,
                      'file_size_bytes': response['ContentLength'],
                      'processed_at': datetime.now(
                          timezone.utc
                      ).isoformat(),
                      'status': 'SUCCESS'
                  }

                  log_key = 'processed/' + key.split('/')[-1] + '.json'

                  s3.put_object(
                      Bucket=bucket,
                      Key=log_key,
                      Body=json.dumps(metadata, indent=2),
                      ContentType='application/json'
                  )

                  sns.publish(
                      TopicArn=os.environ['SNS_TOPIC_ARN'],
                      Subject='File Processing Successful',
                      Message=json.dumps(metadata, indent=2)
                  )

              return {
                  'statusCode': 200,
                  'body': 'File processed successfully'
              }

  S3InvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FileProcessingLambda.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}'
      SourceAccount: !Ref AWS::AccountId

Outputs:
  S3BucketName:
    Description: File processing S3 bucket
    Value: !Ref FileProcessingBucket

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref FileProcessingLambda

  SNSTopicArn:
    Description: SNS notification topic ARN
    Value: !Ref FileProcessingTopic

  VPCId:
    Description: Created VPC ID
    Value: !Ref FileProcessingVPC
